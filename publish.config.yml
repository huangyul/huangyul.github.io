# ============================================================================
# Obsidian publish config (HuangYul multi-section)
# ============================================================================

site:
  title: "HuangYul · Blog & Notes"
  name: "HuangYul"
  motto: "Keep thinking · Keep doing"
  description: "AI agent engineering, algorithms, and personal notes"
  # Avatar path relative to vault root; monogram used if missing
  avatar: "static/image/avatar.jpg"
  # Default theme: "light" or "dark"
  defaultTheme: "light"
  github: "https://github.com/huangyul"

# ----------------------------------------------------------------------------
# Home (About)
# ----------------------------------------------------------------------------
home:
  hello: "Hi, I'm HuangYul."
  paragraphs:
    - "I'm a developer focused on AI agent applications and engineering. My stack centers on Python, FastAPI, PostgreSQL (pgvector), LangGraph, and Docker."
    - "Before AI application engineering, I worked on web full-stack and frontend architecture. This site is built automatically from my Obsidian vault — tech blog posts plus structured notes on AI and algorithms."
  careerTitle: "Currently focused on:"
  career:
    - title: "AI agent engineering"
      detail: "LLM APIs, tool calling, RAG, LangGraph state machines, and agent workflows"
    - title: "Algorithms & data structures"
      detail: "Core algorithm patterns in Go — intuition, derivation, and manual walkthroughs"
    - title: "Vibe coding"
      detail: "AI-assisted coding workflows and shipping practice"
  outro: "Welcome to my digital garden — hope something here sparks an idea."
  signature: "Bless,\nHuangYul"

# ----------------------------------------------------------------------------
# Sections (nav order)
# Types: blog | knowledge | cards | archive
# ----------------------------------------------------------------------------
sections:
  - id: "blog"
    navLabel: "Blog"
    title: "Blog"
    motto: "Thinking · Essays · Tech notes"
    type: "blog"
    sources:
      - "blog"

  - id: "notes"
    navLabel: "Notes"
    title: "Notes"
    motto: "Structured learning notes · Build first, theory second"
    type: "knowledge"
    sources:
      - path: "ai"
        label: "AI & Agent development"
      - path: "od"
        label: "Algorithms with Go"

  - id: "archive"
    navLabel: "Archive"
    title: "Archive"
    motto: "A trail through time"
    type: "archive"

# ----------------------------------------------------------------------------
# Global exclude (paths / globs never published)
# ----------------------------------------------------------------------------
exclude:
  - "世软相关"
  - "ai-agents-from-zero"
  - ".obsidian"
  - ".site"
  - ".github"
  - "tmp"
  - "**/*密码*"
  - "**/*secret*"
  - "**/README.md"
